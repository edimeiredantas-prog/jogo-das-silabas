<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Professor - Criar Jogo</title>
  <!-- Biblioteca Oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h1>Painel do Professor</h1>

  <label for="pinInput">PIN do Jogo:</label>
  <input type="text" id="pinInput" placeholder="Ex: SET">

  <br><br>

  <label for="fasesInput">Dados do Jogo / Fases (JSON ou Texto):</label>
  <textarea id="fasesInput" placeholder='{"fases": ["sílaba1", "sílaba2"]}'></textarea>

  <br><br>

  <button onclick="salvarJogoNoSupabase()">Criar / Salvar Jogo</button>

  <script>
    // Configurações do Supabase
    const SUPABASE_URL = 'https://vvhgaryqqhuvsbodpzmq.supabase.co';
    const SUPABASE_ANON_KEY = 'SUA_CHAVE_PUBLISHABLE_AQUI'; // Cole sua chave Publishable/Anon aqui
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function salvarJogoNoSupabase() {
      const pinDigitado = document.getElementById('pinInput').value.trim();
      const conteudoJogo = document.getElementById('fasesInput').value;

      if (!pinDigitado) {
        alert("Por favor, digite um PIN válido!");
        return;
      }

      // Envia os dados diretamente para a tabela no Supabase
      const { data, error } = await _supabase
        .from('jogos')
        .insert([{ pin: pinDigitado, dados: conteudoJogo }]);

      if (error) {
        alert("Erro ao salvar o jogo na nuvem: " + error.message);
        console.error(error);
      } else {
        alert("Jogo salvo com sucesso! O PIN '" + pinDigitado + "' já pode ser usado pelos alunos.");
      }
    }
  </script>

</body>
</html>
