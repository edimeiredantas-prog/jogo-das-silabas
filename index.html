<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo das Sílabas - Painel & Aluno</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f7f6; color: #333; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .screen { display: none; }
    .screen.active { display: block; }

    nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    nav button { flex: 1; padding: 10px; border: none; background: #e0e0e0; font-weight: bold; cursor: pointer; border-radius: 6px; }
    nav button.active { background: #3498db; color: white; }

    h1, h2, h3 { text-align: center; color: #2c3e50; margin-bottom: 15px; }
    .btn { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
    .btn:hover { background: #2980b9; }
    .btn-success { background: #2ecc71; }
    .btn-success:hover { background: #27ae60; }
    
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }

    .game-layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; margin-top: 20px; }
    .words-column { display: flex; flex-direction: column; gap: 15px; }
    
    .word-row { display: grid; grid-template-columns: 90px 1fr; gap: 15px; align-items: center; background: #fafafa; padding: 12px; border-radius: 8px; border: 1px solid #ddd; }
    .img-box { width: 85px; height: 85px; border: 2px solid #333; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #fff; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .slots-container { display: flex; gap: 10px; align-items: center; }
    .slot { width: 60px; height: 60px; background: white; border: 2px solid #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; cursor: pointer; position: relative; }
    .slot.selected { border: 4px solid #f39c12; background-color: #fef9e7; }
    .slot.filled { background-color: #ebf5fb; border-color: #3498db; }
    .slot.correct { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; }
    .slot.wrong { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }

    .sidebar-options { background: #f8f9fa; border: 2px dashed #bdc3c7; border-radius: 8px; padding: 12px; text-align: center; }
    .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .option { height: 50px; background: white; border: 2px solid #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: bold; cursor: pointer; }
    .option:hover { background-color: #ebf5fb; }
    .option.hidden { display: none !important; }

    .badge { padding: 8px 15px; border-radius: 6px; background: #3498db; color: white; font-size: 15px; font-weight: bold; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    table th, table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    table th { background: #f2f2f2; }
  </style>
</head>
<body>

<div class="container">

  <nav id="top-nav">
    <button class="active" onclick="switchMode('student')">Acesso do Aluno</button>
    <button onclick="switchMode('teacher')">Painel do Professor</button>
  </nav>

  <!-- TELA 1: LOGIN ALUNO -->
  <div id="screen-student-login" class="screen active">
    <h1>🎮 Área do Aluno</h1>
    <div class="input-group">
      <label>Nome do Aluno:</label>
      <input type="text" id="player-name" placeholder="Digite seu nome">
    </div>
    <div class="input-group">
      <label>PIN da Turma / Jogo:</label>
      <input type="text" id="player-pin" placeholder="Ex: AGO1" style="text-transform: uppercase;">
    </div>
    <button class="btn btn-success" onclick="startStudentGame()">Entrar no Jogo 🚀</button>
  </div>

  <!-- TELA 2: TELA DO JOGO -->
  <div id="screen-game" class="screen">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <span class="badge" id="info-student">Aluno: -</span>
      <span class="badge" style="background:#e67e22;" id="info-phase">Fase 1</span>
    </div>
    <h2>Escolha a sílaba correta para cada imagem:</h2>
    <div class="game-layout">
      <div class="words-column" id="words-container"></div>
      <div class="sidebar-options">
        <h3>Opções</h3>
        <div class="options-grid" id="options-container"></div>
      </div>
    </div>
    <button class="btn btn-success" id="btn-next" style="margin-top:25px;" onclick="checkAnswers()">Concluir Fase 🏆</button>
  </div>

  <!-- TELA 3: FINALIZAÇÃO -->
  <div id="screen-finish" class="screen" style="text-align: center;">
    🎉
    <h2>Parabéns! Você concluiu a atividade!</h2>
    <p style="font-size: 22px; margin: 20px 0;">Sua pontuação total: <strong id="final-score" style="color:#2ecc71;">0</strong> acertos!</p>
    <button class="btn" onclick="switchMode('student')">Voltar ao Inicio</button>
  </div>

  <!-- TELA 4: PAINEL DO PROFESSOR -->
  <div id="screen-teacher-panel" class="screen">
    <h1>⚙️ Painel do Professor</h1>
    
    <div style="background: #eef9ff; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
      <h3>📌 Criar Nova Fase / Editar Fase</h3>
      <div class="input-group">
        <label>PIN para esta fase (ex: AGO1):</label>
        <input type="text" id="cfg-pin" value="AGO1" style="text-transform: uppercase;">
      </div>

      <div id="cfg-words-container"></div>

      <button class="btn btn-success" onclick="savePhaseConfig()">Salvar Fase no Sistema 💾</button>
    </div>

    <h3>🏆 Ranking dos Alunos (Salvo Neste Navegador)</h3>
    <table>
      <thead>
        <tr>
          <th>Aluno</th>
          <th>PIN / Turma</th>
          <th>Pontuação</th>
          <th>Data</th>
        </tr>
      </thead>
      <tbody id="ranking-body"></tbody>
    </table>
  </div>

</div>

<script>
  // =========================================================================
  // BANCO DE DADOS DE FASES (USANDO AS IMAGENS DA PASTA "imagens/")
  // =========================================================================
  let dbGames = JSON.parse(localStorage.getItem("dbGames")) || {
    "AGO1": {
      title: "Fase 1",
      words: [
        { name: "COPO", syllables: ["CO", "PO"], options: ["PA", "TA"], img: "imagens/copo.png" },
        { name: "MOLA", syllables: ["MO", "LA"], options: ["CA", "BO"], img: "imagens/mola.png" },
        { name: "CAFE", syllables: ["CA", "FÉ"], options: ["TE", "VE"], img: "imagens/cafe.png" },
        { name: "RATO", syllables: ["RA", "TO"], options: ["NE", "LO"], img: "imagens/rato.png" }
      ]
    }
  };

  let ranking = JSON.parse(localStorage.getItem("ranking")) || [];

  let currentStudent = {};
  let currentPhaseData = null;
  let selectedSlot = null;
  let isFinished = false;

  function switchMode(mode) {
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));

    if (mode === "student") {
      document.querySelectorAll("nav button")[0].classList.add("active");
      document.getElementById("screen-student-login").classList.add("active");
    } else {
      document.querySelectorAll("nav button")[1].classList.add("active");
      document.getElementById("screen-teacher-panel").classList.add("active");
      loadTeacherPanel();
    }
  }

  function startStudentGame() {
    const name = document.getElementById("player-name").value.trim();
    const pin = document.getElementById("player-pin").value.trim().toUpperCase();

    if (!name || !pin) {
      alert("Por favor, preencha seu nome e o PIN da turma!");
      return;
    }

    if (!dbGames[pin]) {
      alert("PIN não encontrado! Tente 'AGO1'.");
      return;
    }

    currentStudent = { name, pin };
    currentPhaseData = dbGames[pin];

    document.getElementById("info-student").innerText = `Aluno: ${name}`;
    document.getElementById("info-phase").innerText = `Fase PIN: ${pin}`;

    loadGameScreen();
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById("screen-game").classList.add("active");
  }

  function loadGameScreen() {
    isFinished = false;
    selectedSlot = null;
    const wordsContainer = document.getElementById("words-container");
    const optionsContainer = document.getElementById("options-container");
    wordsContainer.innerHTML = "";
    optionsContainer.innerHTML = "";

    let allOptions = [];

    currentPhaseData.words.forEach((item, wIdx) => {
      allOptions.push(...item.syllables, ...item.options);

      const row = document.createElement("div");
      row.className = "word-row";
      row.innerHTML = `
        <div class="img-box"><img src="${item.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2405/2405479.png'"></div>
        <div class="slots-container">
          ${item.syllables.map((_, sIdx) => `<div class="slot" data-word="${wIdx}" data-slot="${sIdx}" onclick="selectSlot(this)"></div>`).join('')}
        </div>
      `;
      wordsContainer.appendChild(row);
    });

    [...allOptions].sort(() => Math.random() - 0.5).forEach((syl, idx) => {
      const opt = document.createElement("div");
      opt.className = "option";
      opt.innerText = syl;
      opt.id = `opt-${idx}`;
      opt.onclick = () => fillSlot(opt, syl);
      optionsContainer.appendChild(opt);
    });
  }

  function selectSlot(slot) {
    if (isFinished) return;
    if (slot.innerText !== "") {
      const optId = slot.dataset.optId;
      if (optId) document.getElementById(optId)?.classList.remove("hidden");
      slot.innerText = "";
      slot.dataset.optId = "";
      slot.classList.remove("filled");
    }
    if (selectedSlot) selectedSlot.classList.remove("selected");
    selectedSlot = slot;
    selectedSlot.classList.add("selected");
  }

  function fillSlot(optBtn, text) {
    if (isFinished || !selectedSlot) {
      if (!selectedSlot) alert("Clique primeiro em um quadrado em branco!");
      return;
    }
    if (selectedSlot.dataset.optId) {
      document.getElementById(selectedSlot.dataset.optId)?.classList.remove("hidden");
    }
    selectedSlot.innerText = text;
    selectedSlot.dataset.optId = optBtn.id;
    selectedSlot.classList.remove("selected");
    selectedSlot.classList.add("filled");
    optBtn.classList.add("hidden");
    selectedSlot = null;
  }

  function checkAnswers() {
    if (isFinished) return;
    let score = 0;
    isFinished = true;

    currentPhaseData.words.forEach((item, wIdx) => {
      item.syllables.forEach((syl, sIdx) => {
        const slot = document.querySelector(`.slot[data-word="${wIdx}"][data-slot="${sIdx}"]`);
        if (slot) {
          if (slot.innerText.trim() === syl) {
            slot.classList.add("correct");
            score++;
          } else {
            slot.classList.add("wrong");
          }
        }
      });
    });

    // Salva no Ranking
    ranking.push({
      name: currentStudent.name,
      pin: currentStudent.pin,
      score: score,
      date: new Date().toLocaleDateString("pt-BR")
    });
    localStorage.setItem("ranking", JSON.stringify(ranking));

    setTimeout(() => {
      document.getElementById("final-score").innerText = score;
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById("screen-finish").classList.add("active");
    }, 1500);
  }

  // --- PAINEL DO PROFESSOR ---
  function loadTeacherPanel() {
    const pin = document.getElementById("cfg-pin").value.toUpperCase();
    const phase = dbGames[pin] || dbGames["AGO1"];
    const container = document.getElementById("cfg-words-container");
    container.innerHTML = "";

    phase.words.forEach((item, idx) => {
      const box = document.createElement("div");
      box.style.cssText = "border:1px solid #ccc; padding:10px; border-radius:6px; margin-bottom:10px; background:#fff;";
      box.innerHTML = `
        <h4>Palavra ${idx + 1}</h4>
        <div class="input-group">
          <label>Nome / Sílabas Separadas (Ex: CO-PO):</label>
          <input type="text" id="cfg-syl-${idx}" value="${item.syllables.join('-')}">
        </div>
        <div class="input-group">
          <label>Caminho da Imagem na Pasta (Ex: imagens/copo.png):</label>
          <input type="text" id="cfg-img-${idx}" value="${item.img}">
        </div>
      `;
      container.appendChild(box);
    });

    renderRanking();
  }

  function savePhaseConfig() {
    const pin = document.getElementById("cfg-pin").value.trim().toUpperCase();
    if (!pin) { alert("Digite um PIN!"); return; }

    let newWords = [];
    for (let i = 0; i < 4; i++) {
      const sylVal = document.getElementById(`cfg-syl-${i}`)?.value.split("-") || ["PA", "LAVRA"];
      const imgVal = document.getElementById(`cfg-img-${i}`)?.value || "imagens/copo.png";
      newWords.push({
        name: sylVal.join(""),
        syllables: sylVal,
        options: ["TA", "BO"],
        img: imgVal
      });
    }

    dbGames[pin] = { title: `Fase ${pin}`, words: newWords };
    localStorage.setItem("dbGames", JSON.stringify(dbGames));
    alert(`Fase com o PIN "${pin}" salva com sucesso!`);
  }

  function renderRanking() {
    const tbody = document.getElementById("ranking-body");
    tbody.innerHTML = "";
    ranking.forEach(r => {
      tbody.innerHTML += `
        <tr>
          <td>${r.name}</td>
          <td>${r.pin}</td>
          <td>${r.score} acertos</td>
          <td>${r.date}</td>
        </tr>
      `;
    });
  }
</script>

</body>
</html>
